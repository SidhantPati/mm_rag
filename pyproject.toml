[project]
name = "mm-rag"
version = "0.1.0"
description = "Multimodal RAG project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "onnxruntime<=1.19.2",
    "unstructured[all-docs]>=0.18.27",
]

[tool.uv]
no-build-package = ["cryptography", "llvmlite", "numba", "onnx", "pikepdf", "opencv-python", "opencv-python-headless"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "pypdfium2<=5.11.0",
    "numba>=0.59",
    "pikepdf<=9.3.0",
    "onnx<=1.22.0",
    "opencv-python<=4.9.0.80",
    "opencv-python-headless<=4.9.0.80",
    "numpy<2",
    "scipy<=1.13.1",
]
