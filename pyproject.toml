[project]
name = "mm-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "numpy<2",
    "onnxruntime<=1.19.2",
    "sentence-transformers<4",
    "transformers<4.45",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
